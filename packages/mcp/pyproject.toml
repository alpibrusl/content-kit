[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-kit-mcp"
version = "0.1.0"
description = "MCP server exposing the content-kit CLIs (bookkit, podcastkit) as tools, generated from each CLI's own introspect contract"
license = "EUPL-1.2"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    # The CLIs this server drives; installing the MCP installs the toolchain.
    "bookkit",
    "podcastkit",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
content-kit-mcp = "content_kit_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/content_kit_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
