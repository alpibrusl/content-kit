[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-kit-core"
version = "0.1.0"
description = "Shared spine of the content platform — CLI conventions, LLM-agnostic writers, and the cross-tool bridge contracts (episode, storyboard, bible)"
license = "EUPL-1.2"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
claude = ["anthropic>=0.25"]
openai = ["openai>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/content_kit_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/content_kit_core"]
omit = [
    "*/writers/claude.py",
    "*/writers/ollama.py",
    "*/writers/openai_writer.py",
    "*/writers/openai_compat.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
